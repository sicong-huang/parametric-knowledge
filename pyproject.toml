[project]
name = "pk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "causal-conv1d>=1.5.0",
    "datasets>=5.0.0",
    "deepspeed>=0.16.0",
    "flash-linear-attention[cuda]>=0.5.1",
    "mamba-ssm==2.3.2.post1",
    "torch>=2.10.0",
    "transformers>=5.14.1",
    "trl>=1.8.0",
]

# PyTorch wheels (CUDA 12.8) — Delta's driver doesn't support the default cu130 wheel.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
# PyPI sdist for 2.2.4 was missing csrc/ (packaging bug) — build from the git tag instead.
mamba-ssm = { git = "https://github.com/state-spaces/mamba", tag = "v2.3.2.post1" }

# These build CUDA kernels against the installed torch and must not be built
# in an isolated env without it.
[tool.uv]
no-build-isolation-package = ["causal-conv1d", "mamba-ssm"]

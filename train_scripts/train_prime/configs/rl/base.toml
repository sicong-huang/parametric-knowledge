# Shared prime-rl RL settings: GRPO on the held-out synthetic-QA questions, starting from
# the c4_43pct SFT model. Composed with one generated overlay (r1_10pct / r2_19pct /
# r3_43pct / r4_full) that sets max_steps, run.name and the two train sources:
#
#   uv run --no-sync --project ~/prime-rl rl @ train_scripts/train_prime/configs/rl/base.toml \
#                                            @ train_scripts/train_prime/configs/rl/r1_10pct.toml
#
# (run_rl.sh does this plus PYTHONPATH for the kg_qa taskset, the HF export and eval.py.)
# Overlays are GENERATED by prepare_rl_data.py from batch_size / group_size below. Rerun
# it after changing either so max_steps stays = 1 epoch.

output_dir = "checkpoints/prime-rl"
dashboard = false
# Prompt (~15-30 tokens) + completion (<=256) fits easily.
seq_len = 1024

# Starting point: c4_43pct SFT (43.3% of the training questions). Override with
# run_rl.sh --model.
[model]
name = "checkpoints/prime-sft/qwen3.5-0.8b-c4_43pct/checkpoints/step_1509/weights"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

# Trainer -> vLLM weight sync through files on disk after each step. The default NCCL broadcast
# fails on nlp-sv11: there is no NVLink, so prime-rl disables NCCL's P2P/SHM transports and
# init_broadcaster dies with "NCCL error: internal error". A 0.8B model is ~1.5 GB per sync.
[weight_broadcast]
type = "filesystem"

[orchestrator]
# Rollouts per step: 64 prompts x 8 rollouts. Each step mixes the direct and reasoning
# sources about 1:1 (ratio = 1 each).
batch_size = 512

[orchestrator.train]
group_size = 8

# Same 256-token budget as eval.py. Temperature 1.0 = sample from the policy itself.
[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 256

# Typed renderer, as in SFT ("auto" can't resolve a local path). Each source's
# chat_template_kwargs.enable_thinking (in the overlay) picks direct vs reasoning.
[orchestrator.renderer]
name = "qwen3.5"

# Per-prompt loss weighting: every trained group (one prompt x 8 rollouts) gets equal weight,
# instead of every token (prime-rl's default "token"). Reasoning completions are ~12x longer than
# direct ones, so with "token" direct groups got ~4% of the update in r1. See rl_loss_weighting.md.
[orchestrator.train.algo]
loss_aggregation = "prompt"

[trainer.optim]
lr = 1e-6

# Save only the final checkpoint; run_rl.sh exports it to HF safetensors.
[ckpt]

[inference.vllm]
max_model_len = 1024

# Metrics go to the run dir via the file monitor. The Prime platform monitor needs a
# PRIME_API_KEY, so turn it off.
[monitors]
prime = "None"

# Shared prime-rl SFT settings for the synthetic-QA data-scaling sweep.
#
# Composed with one per-config overlay (c1_full / c2_10pct / c3_19pct / c4_43pct),
# which sets data.name, max_steps, scheduler.warmup_steps and run.name:
#
#   uv run --no-sync --project ~/prime-rl sft @ train_scripts/train_prime/configs/base.toml \
#                                             @ train_scripts/train_prime/configs/c2_10pct.toml
#
# Overlays are GENERATED by prepare_data.py from the batch settings below — rerun it
# after changing [data].seq_len / [data].batch_size so max_steps stays = N epochs.
#
# Mirrors the TRL recipe in train_synthetic/sft.py + commands.md (qwen3.5-0.8b):
# AdamW lr 2e-5, wd 0.01, grad-clip 1.0, 5% linear warmup -> cosine to 0, 2 epochs,
# completion-only loss, ~34 samples per optimizer step (TRL: 32).

# Top-level keys must precede every [table]. Runs land in <output_dir>/<run.name>/.
output_dir = "checkpoints/prime-sft"
dashboard = false

# Pretrained (biography CPT) checkpoint from train_synthetic/pretrain.py. Override with
# --model.name <path> (run_sft.sh --model) for gemma4 / nemotron checkpoints.
[model]
name = "checkpoints/pretrain-qwen3.5-0.8b"

# A typed renderer is REQUIRED for per-sample renderer args (enable_thinking below);
# "auto" can't resolve a local checkpoint path anyway. Use "gemma4" / "nemotron-3"
# for those model families.
[renderer]
name = "qwen3.5"

[data]
# Rows are always PACKED: batch_size counts packed rows of seq_len tokens, not samples.
# 2 rows x 1024 tokens ~= 34 QA samples/step (direct ~30 tok, reasoning ~70-180 tok),
# matching TRL's 2 GPUs x 8 x grad-accum 2 = 32. Divisible by 1 or 2 GPUs.
seq_len = 1024
batch_size = 2
micro_batch_size = 1
shuffle = true
seed = 100

# Each row's `enable_thinking` column overrides [renderer].enable_thinking, so direct
# rows get the empty <think></think> prefill and reasoning rows the open <think> —
# the same prompts eval.py builds with apply_chat_template(enable_thinking=...).
[data.columns.renderer]
enable_thinking = "enable_thinking"

# Completion-only loss, as in TRL: user/system tokens masked (prime-rl's default), AND the
# thinking prefill the generation prompt supplies (<think>\n / <think>\n\n</think>\n\n) is masked
# too, since eval.py always provides it. generation_prompt is a LOCAL prime-rl option, added by
# patches/prime-rl-local.patch (stock prime-rl rejects the key).
[data.loss_mask]
system = false
user = false
assistant = true
tool = false
generation_prompt = false

[optim]
type = "adamw"
lr = 2e-5
weight_decay = 0.01
max_norm = 1.0

[scheduler]
type = "cosine"
min_lr = 0.0
# warmup_steps set per overlay (5% of max_steps)

# Save only the final checkpoint (DCP); run_sft.sh exports it to HF safetensors.
[ckpt]

# Metrics go to <run>/ via the file monitor. The Prime platform monitor is on by default and
# aborts without a PRIME_API_KEY, so turn it off. For W&B, add a [monitors.wandb] table.
[monitors]
prime = "None"

[deployment]
num_train_gpus = 1
